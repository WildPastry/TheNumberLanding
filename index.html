<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OnlyNumbers — a date tracking app." />
    <title>OnlyNumbers</title>

    <!-- Link previews. No canonical tag on purpose: this is a single-page app,
         so one index.html serves /home, /privacy and /terms, and a hard-coded
         canonical here would tell crawlers the other two are duplicates of the
         first. og:url names the entry point only. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OnlyNumbers" />
    <meta property="og:title" content="OnlyNumbers" />
    <meta
      property="og:description"
      content="OnlyNumbers — a date tracking app." />
    <meta
      property="og:url"
      content="https://www.onlynumbers.mikeparker.co.nz/home" />
    <meta
      property="og:image"
      content="https://www.onlynumbers.mikeparker.co.nz/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The OnlyNumbers mark: ONLY in condensed capitals beside Numbers in blue." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OnlyNumbers" />
    <meta
      name="twitter:description"
      content="OnlyNumbers — a date tracking app." />
    <meta
      name="twitter:image"
      content="https://www.onlynumbers.mikeparker.co.nz/og-image.png" />
    <script>
      (function () {
        var root = document.documentElement;
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'dark' || saved === 'light') theme = saved;
        } catch (err) {
          if (location.hostname === 'localhost') {
            console.warn('Theme init failed:', err);
          }
        }
        root.classList.toggle('dark', theme === 'dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
